<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="/user/css/Sign-Up_n_login_Page.css">
  <link rel="stylesheet" href="/user/css/profile_page.css">
</head>

<body>
    <main>

      <p id="msg" style="text-align:center;font-weight:bold;color:#b00020;"></p>
      <script>
        (function () {
          var p = new URLSearchParams(location.search), m = document.getElementById('msg');
          if (p.get('error')) m.textContent = p.get('error');
          else if (p.get('registered')) { m.style.color = '#0a7a2f'; m.textContent = 'Account created! Please log in.'; }
        })();
      </script>
      <form method="POST" action="/user/login" class="profile-form">
        <label>
          Email:<br>
          <input type="email" name="email" placeholder="Login Email" required><br>
        </label><br><br>

        <label>
          Password:<br>
          <input type="password" name="password" placeholder="Login Password" required><br>
        </label><br><br>

        <!-- Hidden field to identify the user by current email -->
        <input type="hidden" name="currentEmail" value="{email}" />

        <button type="submit">Login</button>
      </form>
      <p style="text-align:center">No account yet? <a href="/user/signup">Sign up</a></p>
    </main>
</body>
</html>
