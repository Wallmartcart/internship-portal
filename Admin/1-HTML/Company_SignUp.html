<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Company Sign Up</title>
  <link rel="stylesheet" href="/company/2-CSS/admin.css">
</head>
<body>
  <div class="form-container">
    <h2>Company Registration</h2>

    <p id="msg" style="text-align:center;font-weight:bold;color:#b00020;"></p>
    <script>
      (function () {
        var p = new URLSearchParams(location.search), m = document.getElementById('msg');
        if (p.get('error')) m.textContent = p.get('error');
        else if (p.get('registered')) { m.style.color = '#0a7a2f'; m.textContent = 'Account created! Please log in.'; }
      })();
    </script>
    <form action="/company/signup" method="POST" id="signupForm">
      <label for="company_name">Company Name</label>
      <input type="text" id="company_name" name="company_name" required />

      <label for="email">Company Email</label>
      <input type="email" id="email" name="email" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="6"/>

      <label for="location">Location</label>
      <input type="text" id="location" name="location" required />

      <label for="industry">Industry</label>
      <input type="text" id="industry" name="industry" placeholder="e.g. Tech, Marketing, etc."/>

      <button type="submit">Register</button>
    </form>
    <p style="text-align: center;">Already have an account? <a href="/company/login">Login here</a></p>
  </div>

  <script src="/company/admin.js"></script>
</body>
</html>
